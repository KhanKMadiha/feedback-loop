name = "feature-signal-proxy"
main = "proxy.js"
compatibility_date = "2025-06-04"

# Local dev defaults to http://localhost:8787 — set data-proxy-url on app.js script tag if different.

[dev]
port = 8787

[vars]
ALLOWED_ORIGINS = "http://localhost:3000,http://127.0.0.1:3000"
RATE_LIMIT_MAX = "5"
RATE_LIMIT_WINDOW = "3600"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "local_rate_limit_placeholder"
preview_id = "local_rate_limit_preview"
